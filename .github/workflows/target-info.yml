name: Target information pane
on:
  pull_request:
    paths:
      - 'Application_Source/TargetInfo*'
      - 'Application_Source/PreviewUi.cs'
      - 'Application_Source/EditedUi.cs'
      - 'Application_Source/TargetNamesUi.cs'
      - 'Application_Source/MainWindow.xaml'
      - 'Application_Source/SkyContext.cs'
      - 'Application_Source/App.cs'
      - 'Application_Source/build.ps1'
      - 'Application_Source/test.ps1'
      - 'scripts/build-target-info.py'
      - 'Installer/InstallCore.cs'
      - 'Installer/Tests.cs'
      - 'Installer/build.ps1'
      - '.github/workflows/target-info.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  info:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build and check offline information lookup
        shell: powershell
        run: |
          .\Application_Source\build.ps1
          .\Application_Source\test.ps1 -TargetInfoOnly
          .\Installer\test.ps1
      - name: Check preview transitions and responsive layouts
        shell: powershell
        run: |
          $output = Join-Path $pwd 'Application_Source\test-data\target-info-ui'
          $process = Start-Process '.\Application_Source\dist\AstroArchive.exe' -ArgumentList @('--ui-test', $output, '--info-only', '--no-updates') -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Target info UI check timed out.' }
          if ($process.ExitCode -ne 0) {
            $errorFile = Join-Path $output 'ui-smoke-error.txt'
            if (Test-Path $errorFile) { Get-Content $errorFile }
            throw 'Target info UI check failed.'
          }
          Get-Content (Join-Path $output 'target-info-smoke.txt')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astroarchive-target-info-preview
          path: |
            Application_Source/test-data/target-info-ui/*.png
            Application_Source/test-data/target-info-ui/*.txt
          retention-days: 7
