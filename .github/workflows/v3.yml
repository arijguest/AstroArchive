name: V3 Windows validation
on:
  push:
    branches: [v3, temp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build the integrated application
        shell: powershell
        run: .\Application_Source\build.ps1
      - name: Check archive engine and remote/live imports
        shell: powershell
        run: .\Application_Source\test.ps1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install read-only loopback fixture dependencies
        run: python -m pip install impacket==0.13.1 pyftpdlib==2.2.0
      - name: Check discovery, guest SMB and FTP archive integration
        shell: powershell
        run: .\Application_Source\test-remote-transports.ps1
      - name: Check installer and updater
        shell: powershell
        run: .\Installer\test.ps1
      - name: Build the installer with remote dependencies and licence material
        shell: powershell
        run: .\Installer\build.ps1 -SkipTests -OutputDirectory .\release-artifacts
      - name: Check network dialog and existing connected-import UI
        shell: powershell
        run: |
          foreach ($mode in @('remote','connected-import','controls','analytics','full')) {
            $output = Join-Path $pwd "release-artifacts\ui-$mode"
            $modeArgument = if ($mode -eq 'full') { @() } else { @("--$mode-only") }
            $process = Start-Process '.\Application_Source\dist\AstroArchive.exe' -ArgumentList (@('--ui-test', $output, '--no-updates') + $modeArgument) -PassThru
            if (-not $process.WaitForExit(240000)) { $process.Kill(); throw "$mode UI check timed out." }
            if ($process.ExitCode -ne 0) {
              $error = Join-Path $output 'ui-smoke-error.txt'
              if (Test-Path $error) { Get-Content $error }
              throw "$mode UI check failed."
            }
          }
          Get-Content '.\release-artifacts\ui-remote\remote-ui-passed.txt'
      - name: Package the portable preview
        shell: powershell
        run: Compress-Archive -Path '.\Application_Source\dist\*' -DestinationPath '.\release-artifacts\AstroArchive-v3-Windows-x64.zip'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astroarchive-v3-windows
          path: release-artifacts/
          if-no-files-found: warn
