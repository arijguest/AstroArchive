name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test application, installer and updater; build Windows package
        shell: powershell
        run: .\scripts\build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-artifacts
      - name: Publish verified installers and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          package=$(python3 -c 'import json; print(json.load(open("release-artifacts/update.json"))["package_version"])')
          tag="v${package}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag must match Installer/release.json ($tag)." >&2
            exit 1
          fi
          # 'release view' returns success for an existing release, including a draft.
          if gh release view "$tag" --json isDraft --jq .isDraft > /tmp/astroarchive-release-state; then
            if [[ "$(cat /tmp/astroarchive-release-state)" != true ]]; then
              echo "Release $tag already published; bump the version or installer revision for a new release."
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "AstroArchive $package" --notes-file release-artifacts/Release_Notes.txt
          fi
          (cd release-artifacts && sha256sum --check *.sha256)
          gh release upload "$tag" release-artifacts/*.exe release-artifacts/*.sha256 release-artifacts/update.json --clobber
          gh release edit "$tag" --draft=false --latest
          if ! gh release view v1.2.0.1 >/dev/null 2>&1; then
            gh release create v1.2.0.1 releases/offline-1.2.0/*.exe releases/offline-1.2.0/*.sha256 --target "$GITHUB_SHA" --title 'AstroArchive 1.2.0 — original offline installer' --notes-file releases/offline-1.2.0/README.md --latest=false
          fi
