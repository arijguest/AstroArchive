name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - name: Test application, installer and updater; build Windows package
        shell: powershell
        run: |
          Start-Transcript -Path windows-build.log
          try { .\scripts\build-release.ps1 }
          finally { Stop-Transcript }
      - name: Report Windows failure details
        if: failure()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = if (Test-Path windows-build.log) { Get-Content windows-build.log -Raw } else { 'Build failed before a transcript was created.' }
          if ($log.Length -gt 50000) { $log = $log.Substring($log.Length - 50000) }
          $report = @{
            name = 'Windows validation details'
            head_sha = $env:GITHUB_SHA
            status = 'completed'
            conclusion = 'failure'
            output = @{ title = 'Windows validation failed'; summary = ('```text' + "`n" + $log + "`n" + '```') }
          } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText('failure-report.json', $report, (New-Object Text.UTF8Encoding($false)))
          gh api "repos/$env:GITHUB_REPOSITORY/check-runs" --method POST --input failure-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not report Windows failure details.' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-artifacts
      - name: Publish verified installers and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          package=$(python3 -c 'import json; print(json.load(open("release-artifacts/update.json"))["package_version"])')
          tag="v${package}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag must match Installer/release.json ($tag)." >&2
            exit 1
          fi
          # 'release view' returns success for an existing release, including a draft.
          if gh release view "$tag" --json isDraft --jq .isDraft > /tmp/astroarchive-release-state; then
            if [[ "$(cat /tmp/astroarchive-release-state)" != true ]]; then
              echo "Release $tag already published; bump the version or installer revision for a new release."
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "AstroArchive $package" --notes-file release-artifacts/Release_Notes.txt
          fi
          (cd release-artifacts && sha256sum --check *.sha256)
          gh release upload "$tag" release-artifacts/*.exe release-artifacts/*.sha256 release-artifacts/update.json --clobber
          gh release edit "$tag" --draft=false --latest
          if ! gh release view v1.2.0.1 >/dev/null 2>&1; then
            gh release create v1.2.0.1 releases/offline-1.2.0/*.exe releases/offline-1.2.0/*.sha256 --target "$GITHUB_SHA" --title 'AstroArchive 1.2.0 — original offline installer' --notes-file releases/offline-1.2.0/README.md --latest=false
          fi
